name: release

on:
  push:
    tags: ['v*-motrix.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a dry run (no leading v)'
        default: '1.37.0-motrix.17-dev'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
    - id: v
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        fi

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: arm64,  asset_arch: arm64, runner: macos-26 }
        # Both macOS arches build on macOS 26 (Tahoe): macos-26 (arm64) and
        # macos-26-intel (x64). macos-13/14 are deprecated; macos-latest points
        # to macos-26 as of mid-2026. The shipped binary's minimum OS is pinned
        # to 11.0 by -mmacosx-version-min in scripts/build-static-osx.sh, so the
        # runner OS version does not affect the deployment target.
        - { arch: x86_64, asset_arch: x64,   runner: macos-26-intel }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Inject version into configure.ac
      run: |
        sed -i '' -E "s/AC_INIT\(\[aria2\],\[[^]]+\]/AC_INIT([aria2],[${{ needs.version.outputs.version }}]/" configure.ac
        grep -qF "AC_INIT([aria2],[${{ needs.version.outputs.version }}]" configure.ac || { echo "version injection did not match AC_INIT"; exit 1; }
    - name: Cache static deps
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: build-release/arch
        key: osx-deps-${{ matrix.arch }}-${{ hashFiles('makerelease-osx.mk', 'scripts/ci/deps.env', 'patches/libssh2-*.patch') }}
    - name: Build deps if not cached
      run: |
        brew install autoconf automake libtool pkg-config gettext
        echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
        scripts/rebuild-static-osx.sh --deps-only
    - name: Build binary
      run: scripts/build-static-osx.sh ${{ matrix.arch }}
    - name: Package
      run: |
        V=${{ needs.version.outputs.version }}
        tar -C build-release/aria2.${{ matrix.arch }}/src -czf \
          "aria2c-$V-darwin-${{ matrix.asset_arch }}.tar.gz" aria2c
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: darwin-${{ matrix.asset_arch }}
        path: aria2c-*-darwin-*.tar.gz

  macos-smoke:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset_arch: arm64, runner: macos-26 }
        - { asset_arch: x64,   runner: macos-26-intel }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: darwin-${{ matrix.asset_arch }}
        path: dist
    - name: Verify static OpenSSL, TLS 1.3 and certificate trust
      run: |
        set -euo pipefail
        archive=$(find dist -type f -name '*.tar.gz' -print -quit)
        test -n "$archive"
        mkdir bin
        tar -xzf "$archive" -C bin

        expected_openssl=$(sed -n 's/^OPENSSL_VERSION=//p' scripts/ci/deps.env)
        version_output=$(bin/aria2c --version)
        printf '%s\n' "$version_output"
        grep -qF "OpenSSL/$expected_openssl" <<< "$version_output"
        if grep -qF 'AppleTLS' <<< "$version_output"; then
          echo 'ERROR: AppleTLS is still present in the macOS release'
          exit 1
        fi

        otool -L bin/aria2c
        if otool -L bin/aria2c | tail -n +2 | grep -Eiq 'lib(ssl|crypto)[^/]*\.dylib'; then
          echo 'ERROR: OpenSSL must be statically linked'
          exit 1
        fi

        # The release must neither load a machine-wide OpenSSL configuration
        # nor require an external CA bundle/provider directory.
        export SSL_CERT_FILE="$RUNNER_TEMP/missing-ca.pem"
        export SSL_CERT_DIR="$RUNNER_TEMP/missing-certs"
        export OPENSSL_CONF="$RUNNER_TEMP/missing-openssl.cnf"
        export OPENSSL_MODULES="$RUNNER_TEMP/missing-modules"
        tls13_output=$(bin/aria2c \
          --no-conf=true --dry-run=true --check-certificate=true \
          --max-tries=2 --connect-timeout=30 --timeout=30 \
          --console-log-level=debug --summary-interval=0 \
          https://tls13.1d.pw 2>&1)
        printf '%s\n' "$tls13_output"
        grep -q 'with TLSv1.3' <<< "$tls13_output"

        bin/aria2c \
          --no-conf=true --dry-run=true --check-certificate=true \
          --max-tries=2 --connect-timeout=30 --timeout=30 \
          --console-log-level=notice --summary-interval=0 \
          https://www.cloudflare.com/favicon.ico

  windows:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { host: x86_64-w64-mingw32, asset_arch: x64 }
        - { host: i686-w64-mingw32,   asset_arch: ia32 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Inject version into configure.ac
      run: |
        sed -i -E "s/AC_INIT\(\[aria2\],\[[^]]+\]/AC_INIT([aria2],[${{ needs.version.outputs.version }}]/" configure.ac
        grep -qF "AC_INIT([aria2],[${{ needs.version.outputs.version }}]" configure.ac || { echo "version injection did not match AC_INIT"; exit 1; }
    - name: Build in mingw image
      run: |
        docker build -f Dockerfile.mingw --build-arg HOST=${{ matrix.host }} -t aria2-mingw .
        id=$(docker create aria2-mingw)
        docker cp "$id:/aria2/src/aria2c.exe" ./aria2c.exe
        docker rm "$id"
        ${{ matrix.host }}-strip ./aria2c.exe || true
    - name: Package
      run: |
        V=${{ needs.version.outputs.version }}
        zip -j "aria2c-$V-win32-${{ matrix.asset_arch }}.zip" aria2c.exe
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: win32-${{ matrix.asset_arch }}
        path: aria2c-*-win32-*.zip

  windows-smoke:
    needs: [version, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset_arch: x64, runner: windows-2022 }
        - { asset_arch: x64, runner: windows-2025 }
        - { asset_arch: ia32, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: win32-${{ matrix.asset_arch }}
        path: dist
    - name: Verify OpenSSL backend and Windows trust store
      shell: pwsh
      run: |
        $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
        if (-not $archive) { throw 'Windows aria2 archive was not downloaded' }
        Expand-Archive -LiteralPath $archive.FullName -DestinationPath bin

        $expectedOpenSSL = (Select-String -Path scripts/ci/deps.env -Pattern '^OPENSSL_VERSION=').Line.Split('=', 2)[1]
        $versionOutput = (& .\bin\aria2c.exe --version 2>&1 | Out-String)
        if ($LASTEXITCODE -ne 0) { throw "aria2c --version failed: $versionOutput" }
        if ($versionOutput -notmatch [regex]::Escape("OpenSSL/$expectedOpenSSL")) {
          throw "Expected OpenSSL/$expectedOpenSSL backend: $versionOutput"
        }
        if ($versionOutput -match 'WinTLS') {
          throw "WinTLS must not be present in the Windows release: $versionOutput"
        }

        Remove-Item Env:SSL_CERT_FILE -ErrorAction SilentlyContinue
        Remove-Item Env:SSL_CERT_DIR -ErrorAction SilentlyContinue
        $urls = @(
          'https://www.cloudflare.com/favicon.ico',
          'https://github.com/motrixapp/aria2/releases/download/v1.37.0-motrix.6/aria2c-1.37.0-motrix.6-win32-x64.zip',
          'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
        )
        foreach ($url in $urls) {
          & .\bin\aria2c.exe `
            --no-conf=true `
            --dry-run=true `
            --check-certificate=true `
            --max-tries=1 `
            --connect-timeout=30 `
            --timeout=30 `
            --console-log-level=notice `
            $url
          if ($LASTEXITCODE -ne 0) {
            throw "HTTPS smoke failed for $url (exit $LASTEXITCODE)"
          }
        }
    - name: Record candidate identity
      shell: pwsh
      run: |
        $resultDir = 'test-results/ws-contract'
        New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
        Get-FileHash -Algorithm SHA256 .\bin\aria2c.exe |
          Format-List | Out-File "$resultDir/binary-sha256.txt"
        (& .\bin\aria2c.exe --version 2>&1 | Out-String) |
          Out-File "$resultDir/version.txt"
    - name: Verify destinations longer than MAX_PATH
      shell: pwsh
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
        LONG_PATHS_POLICY_OFF: '1'
      run: |
        # Turn the machine policy off so only the \\?\ namespace can make a
        # >260-character destination work (agalwood/Motrix#2183). aria2c reads
        # the policy at process start, and the test spawns it afterwards.
        reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 0 /f
        if ($LASTEXITCODE -ne 0) { throw 'could not turn LongPathsEnabled off' }
        node --test test/e2e/windows-long-path.e2e.test.mjs
        if ($LASTEXITCODE -ne 0) { throw 'long-path download failed' }
    - name: Verify persistent WebSocket RPC
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
        ARIA2_E2E_KEEP_TMP: '1'
        ARIA2_E2E_WORK_DIR: ${{ github.workspace }}\test-results\ws-contract\runs
      run: node --test test/e2e/websocket-rpc-contract.e2e.test.mjs
    - name: Upload WebSocket diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ws-contract-${{ matrix.asset_arch }}-${{ matrix.runner }}
        path: test-results/ws-contract
        if-no-files-found: error

  motrix-windows-consumer:
    needs: windows
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: agalwood/Motrix
        ref: de9abc8166066823f11c83141a341a1045c0e416
        path: Motrix
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.10.1
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: Motrix/pnpm-lock.yaml
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: win32-x64
        path: dist
    - name: Inject candidate engine
      shell: pwsh
      run: |
        $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
        if (-not $archive) { throw 'Windows aria2 archive was not downloaded' }
        Expand-Archive -LiteralPath $archive.FullName -DestinationPath engine
        $targetDir = 'Motrix/extra/win32/x64'
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        Copy-Item .\engine\aria2c.exe "$targetDir/aria2c.exe"
    - name: Install Motrix dependencies
      working-directory: Motrix
      env:
        MOTRIX_SKIP_ELECTRON_REBUILD: '1'
        MOTRIX_SKIP_ENGINE_FETCH: '1'
      run: pnpm install --frozen-lockfile
    - name: Verify Motrix WebSocket consumer
      working-directory: Motrix
      run: >-
        pnpm exec vitest run
        src/core/engine/aria2/aria2-adapter.integration.test.ts
        --reporter=verbose
        -t "addTorrent select-file marks only requested files as selected"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { triple: x86_64-linux-musl,  asset_arch: x64 }
        - { triple: aarch64-linux-musl, asset_arch: arm64 }
        - { triple: armv7l-linux-musleabihf, asset_arch: armv7l }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Inject version into configure.ac
      run: |
        sed -i -E "s/AC_INIT\(\[aria2\],\[[^]]+\]/AC_INIT([aria2],[${{ needs.version.outputs.version }}]/" configure.ac
        grep -qF "AC_INIT([aria2],[${{ needs.version.outputs.version }}]" configure.ac || { echo "version injection did not match AC_INIT"; exit 1; }
    - name: Build in musl image
      run: |
        docker build -f Dockerfile.linux --build-arg TRIPLE=${{ matrix.triple }} -t aria2-linux .
        id=$(docker create aria2-linux)
        docker cp "$id:/aria2/src/aria2c" ./aria2c
        docker rm "$id"
    - name: Verify fully static
      run: file ./aria2c | grep -qE 'statically linked|static-pie'
    - name: Package
      run: |
        V=${{ needs.version.outputs.version }}
        tar -czf "aria2c-$V-linux-${{ matrix.asset_arch }}.tar.gz" aria2c
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-${{ matrix.asset_arch }}
        path: aria2c-*-linux-*.tar.gz

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Inject version into configure.ac
      run: |
        sed -i -E "s/AC_INIT\(\[aria2\],\[[^]]+\]/AC_INIT([aria2],[${{ needs.version.outputs.version }}]/" configure.ac
        grep -qF "AC_INIT([aria2],[${{ needs.version.outputs.version }}]" configure.ac || { echo "version injection did not match AC_INIT"; exit 1; }
    - name: Build in android image
      run: |
        docker build -f Dockerfile.android -t aria2-android .
        id=$(docker create aria2-android)
        docker cp "$id:/aria2/src/aria2c" ./aria2c
        docker rm "$id"
    - name: Package
      run: |
        V=${{ needs.version.outputs.version }}
        tar -czf "aria2c-$V-android-arm.tar.gz" aria2c
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-arm
        path: aria2c-*-android-arm.tar.gz

  cookie-contract:
    needs: [macos, windows, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset: darwin-arm64, runner: macos-26 }
        - { asset: darwin-x64, runner: macos-26-intel }
        - { asset: win32-x64, runner: windows-2025 }
        - { asset: win32-ia32, runner: windows-2025 }
        - { asset: linux-x64, runner: ubuntu-24.04 }
        - { asset: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ matrix.asset }}
        path: dist
    - name: Extract release candidate
      shell: bash
      run: |
        mkdir bin
        python - <<'PYTHON'
        import pathlib, tarfile, zipfile
        archive = next(pathlib.Path('dist').iterdir())
        if archive.suffix == '.zip':
            with zipfile.ZipFile(archive) as source:
                source.extractall('bin')
        else:
            with tarfile.open(archive) as source:
                source.extractall('bin', filter='data')
        PYTHON
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "ARIA2_E2E_BIN=$GITHUB_WORKSPACE/bin/aria2c.exe" >> "$GITHUB_ENV"
        else
          chmod +x bin/aria2c
          echo "ARIA2_E2E_BIN=$GITHUB_WORKSPACE/bin/aria2c" >> "$GITHUB_ENV"
        fi
    - name: Verify task cookies and credential redirects
      run: node --test test/e2e/task-cookies.e2e.test.mjs

  legacy-checkpoint-contract:
    needs: [macos, windows, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset: darwin-arm64, runner: macos-26, baseline_sha256: bb9e8abf19423e593b4d5962d98ea4a798f94fd2a8431ba214bae5838382dc68 }
        - { asset: darwin-x64, runner: macos-26-intel, baseline_sha256: c578852e975f94e8d2e163e696a4dfc81dec4457618219c09853d20d233900e0 }
        - { asset: linux-x64, runner: ubuntu-24.04, baseline_sha256: bd48c06cbf6bebc32e1b75c2abbdad5c0787800b16266147bd0bf5904ce16e94 }
        - { asset: linux-arm64, runner: ubuntu-24.04-arm, baseline_sha256: 65511295a68fd3bcb002022c2a09364f46a8da6eb385d6c2c3915c5ea349692f }
        - { asset: win32-x64, runner: windows-2025 }
        - { asset: win32-ia32, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ matrix.asset }}
        path: dist
    - name: Extract candidate
      shell: bash
      run: |
        mkdir bin
        python - <<'PYTHON'
        import pathlib, tarfile, zipfile
        archive = next(pathlib.Path('dist').iterdir())
        if archive.suffix == '.zip':
            with zipfile.ZipFile(archive) as source:
                source.extractall('bin')
        else:
            with tarfile.open(archive) as source:
                source.extractall('bin', filter='data')
        PYTHON
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "ARIA2_E2E_BIN=$GITHUB_WORKSPACE/bin/aria2c.exe" >> "$GITHUB_ENV"
        else
          chmod +x bin/aria2c
          echo "ARIA2_E2E_BIN=$GITHUB_WORKSPACE/bin/aria2c" >> "$GITHUB_ENV"
        fi
    - name: Fetch checksum-pinned schema 3 baseline
      if: runner.os != 'Windows'
      shell: bash
      env:
        BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
      run: |
        curl --fail --location --retry 3 --output baseline.tar.gz \
          "https://github.com/motrixapp/aria2/releases/download/v1.37.0-motrix.16/aria2c-1.37.0-motrix.16-${{ matrix.asset }}.tar.gz"
        python - <<'PYTHON'
        import hashlib, os, pathlib, tarfile
        assert hashlib.sha256(pathlib.Path('baseline.tar.gz').read_bytes()).hexdigest() == os.environ['BASELINE_SHA256']
        pathlib.Path('baseline').mkdir()
        with tarfile.open('baseline.tar.gz') as archive:
            archive.extractall('baseline', filter='data')
        PYTHON
        chmod +x baseline/aria2c
        echo "ARIA2_SCHEMA3_BIN=$GITHUB_WORKSPACE/baseline/aria2c" >> "$GITHUB_ENV"
    - name: Verify native import, WAL upgrades, downgrade refusal and crash recovery
      if: runner.os != 'Windows'
      run: node --test test/e2e/legacy-checkpoint-import.e2e.test.mjs
    - name: Verify Windows fails closed
      if: runner.os == 'Windows'
      run: node --test test/e2e/legacy-checkpoint-unsupported.e2e.test.mjs

  motrix-migration-consumer:
    needs: [macos, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset: darwin-arm64, runner: macos-26 }
        - { asset: linux-x64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: agalwood/Motrix
        ref: de9abc8166066823f11c83141a341a1045c0e416
        path: Motrix
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.10.1
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: Motrix/pnpm-lock.yaml
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ matrix.asset }}
        path: dist
    - name: Extract candidate
      run: |
        mkdir bin
        tar -xzf dist/*.tar.gz -C bin
        chmod +x bin/aria2c
        echo "MOTRIX_LEGACY_CHECKPOINT_ENGINE=$GITHUB_WORKSPACE/bin/aria2c" >> "$GITHUB_ENV"
    - name: Install Motrix dependencies
      working-directory: Motrix
      env:
        MOTRIX_SKIP_ELECTRON_REBUILD: '1'
        MOTRIX_SKIP_ENGINE_FETCH: '1'
      run: pnpm install --frozen-lockfile
    - name: Verify Motrix migration adapter and activation recovery
      working-directory: Motrix
      run: >-
        pnpm exec vitest run
        src/core/legacy-import
        src/core/engine/aria2/aria2-legacy-checkpoint.test.ts
        src/core/engine/aria2/aria2-legacy-checkpoint.integration.test.ts
        src/core/engine/aria2/aria2-legacy-bt-policy.test.ts
        src/core/engine/aria2/aria2-sqlite-recovery.test.ts
        --reporter=verbose

  publish:
    needs: [macos-smoke, windows-smoke, motrix-windows-consumer, linux, android, cookie-contract, legacy-checkpoint-contract, motrix-migration-consumer]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with: { path: dist, merge-multiple: true }
    - name: Generate SHA256SUMS
      run: cd dist && sha256sum aria2c-* > SHA256SUMS
    - name: Create/refresh release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf '%s\n' \
          'aria2 fork build for Motrix. Base: upstream 1.37.0.' \
          '' \
          'Highlights:' \
          '- Import native Motrix v1 .aria2 checkpoints with authenticated, idempotent RPCs.' \
          '- Persist paused BT recovery with the original GID, verified metadata and crash-safe SQLite transactions.' \
          '- Preserve a complete SQLite backup, including committed WAL pages, before upgrading an existing schema to 5.' \
          '- Gate macOS and Linux migration recovery against the release binaries and the Motrix application.' \
          '- Windows explicitly refuses unsupported legacy-progress recovery.' \
          '- Retain task-scoped cookies, cross-origin credential isolation and long-path support.' \
          '' \
          'Compatibility:' \
          '- Schema 5 cannot be opened by older engines. Downgrades require the pre-upgrade backup; do not delete or reset the upgraded database.' \
          '- BT activation verifies pieces and may write shared-piece bytes in an unselected adjacent file; zero upload is not guaranteed.' \
          '' \
          'All attached archives are covered by SHA256SUMS.' \
          > release-notes.md

        if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
        else
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
        fi
