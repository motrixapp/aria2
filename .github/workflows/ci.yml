name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
        compiler: [gcc, clang]
        crypto: [openssl, gnutls]
        bittorrent: [with-bt, without-bt]
        exclude:
        - os: macos-26
          crypto: gnutls
        - crypto: openssl
          bittorrent: without-bt

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Linux setup
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install \
          g++-12 \
          clang-18 \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          libtool \
          pkg-config \
          libssl-dev \
          libgnutls28-dev \
          libc-ares-dev \
          zlib1g-dev \
          libsqlite3-dev \
          libssh2-1-dev \
          libcppunit-dev
    - name: MacOS setup
      if: runner.os == 'macOS'
      run: |
        brew install cppunit gettext openssl@3 libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool
    - name: Setup clang (Linux)
      if: runner.os == 'Linux' && matrix.compiler == 'clang'
      run: |
        echo 'CC=clang-18' >> $GITHUB_ENV
        echo 'CXX=clang++-18' >> $GITHUB_ENV
    - name: Setup clang (MacOS)
      if: runner.os == 'macOS' && matrix.compiler == 'clang'
      run: |
        echo 'CC=clang' >> $GITHUB_ENV
        echo 'CXX=clang++' >> $GITHUB_ENV
    - name: Setup gcc (Linux)
      if: runner.os == 'Linux' && matrix.compiler == 'gcc'
      run: |
        echo 'CC=gcc-12' >> $GITHUB_ENV
        echo 'CXX=g++-12' >> $GITHUB_ENV
    - name: Setup gcc (MacOS)
      if: runner.os == 'macOS' && matrix.compiler == 'gcc'
      run: |
        echo 'CC=gcc' >> $GITHUB_ENV
        echo 'CXX=g++' >> $GITHUB_ENV
    - name: Libtool
      run: |
        autoreconf -i
    - name: Setup compiler flags
      run: |
        asanflags="-fsanitize=address,undefined -fno-sanitize-recover=undefined"

        CPPFLAGS="$asanflags -g3"
        LDFLAGS="$asanflags"

        echo 'CPPFLAGS='"$CPPFLAGS" >> $GITHUB_ENV
        echo 'LDFLAGS='"$LDFLAGS" >> $GITHUB_ENV
    - name: Disable BitTorrent
      if: matrix.bittorrent == 'without-bt'
      run: |
        FEATURE_FLAGS="$FEATURE_FLAGS --disable-bittorrent"

        echo 'FEATURE_FLAGS='"$FEATURE_FLAGS" >> $GITHUB_ENV
    - name: Configure autotools (Linux, gnutls)
      if: runner.os == 'Linux' && matrix.crypto == 'gnutls'
      run: |
        ./configure --with-gnutls --without-openssl $FEATURE_FLAGS
    - name: Configure autotools (Linux, openssl)
      if: runner.os == 'Linux' && matrix.crypto == 'openssl'
      run: |
        ./configure --without-gnutls --with-openssl $FEATURE_FLAGS
    - name: Configure autotools (macOS)
      if: runner.os == 'macOS'
      run: |
        # Match the release's OpenSSL 3 ABI rather than Homebrew's moving default.
        export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        ./configure \
          --with-openssl --without-gnutls --without-appletls \
          --disable-nls
    - name: Build aria2
      run: |
        make -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)" check
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Verify task cookies and credential redirects
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}/src/aria2c
      run: node --test test/e2e/task-cookies.e2e.test.mjs
    - name: Verify legacy recovery and schema upgrade snapshots
      if: matrix.bittorrent == 'with-bt'
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}/src/aria2c
      run: node --test test/e2e/legacy-checkpoint-import.e2e.test.mjs
    - name: Verify native HTTP redirect policy
      if: matrix.bittorrent == 'with-bt'
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}/src/aria2c
      run: node --test test/e2e/http-redirect-policy.e2e.test.mjs
    - name: Show test-suite.log on failure
      if: failure()
      run: |
        echo "===== test/test-suite.log ====="
        cat test/test-suite.log || echo "(no test/test-suite.log produced)"
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.crypto }}-${{ matrix.bittorrent }}
        path: |
          test/test-suite.log
          test/*.log
        if-no-files-found: ignore

  windows-release-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { host: x86_64-w64-mingw32, asset_arch: x64 }
        - { host: i686-w64-mingw32,   asset_arch: ia32 }
        - { host: aarch64-w64-mingw32, asset_arch: arm64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build release-equivalent OpenSSL binary
      run: |
        docker build \
          -f Dockerfile.mingw \
          --build-arg HOST=${{ matrix.host }} \
          --build-arg TLS_BACKEND=openssl \
          -t aria2-mingw-openssl-${{ matrix.asset_arch }}-ci .
        id=$(docker create aria2-mingw-openssl-${{ matrix.asset_arch }}-ci)
        docker cp "$id:/aria2/src/aria2c.exe" ./aria2c.exe
        docker rm "$id"
        zip -j "aria2c-win32-${{ matrix.asset_arch }}.zip" aria2c.exe
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openssl-win32-${{ matrix.asset_arch }}
        path: aria2c-win32-${{ matrix.asset_arch }}.zip

  windows-ws-contract:
    needs: windows-release-build
    strategy:
      fail-fast: false
      matrix:
        include:
        - { asset_arch: x64, runner: windows-2022, baseline_sha256: 579f17351e81c9fe3ed11d9700f5983235fc362beaf20f5f02820f7a1bfe49b0 }
        - { asset_arch: x64, runner: windows-2025, baseline_sha256: 579f17351e81c9fe3ed11d9700f5983235fc362beaf20f5f02820f7a1bfe49b0 }
        - { asset_arch: ia32, runner: windows-2025, baseline_sha256: 5fe63ed9f6b5b5271ac719a089a6663171f68466b046e38fa9b393af9d28210b }
        # Schema 3 had no ARM64 build; migrate an x64 baseline database
        # under Windows emulation into the native ARM64 candidate.
        - { asset_arch: arm64, runner: windows-11-arm, baseline_arch: x64, baseline_sha256: 579f17351e81c9fe3ed11d9700f5983235fc362beaf20f5f02820f7a1bfe49b0 }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: openssl-win32-${{ matrix.asset_arch }}
        path: dist
    - name: Extract candidate and record its identity
      shell: pwsh
      run: |
        $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
        if (-not $archive) { throw 'Windows aria2 archive was not downloaded' }
        Expand-Archive -LiteralPath $archive.FullName -DestinationPath bin
        $resultDir = 'test-results/ws-contract'
        New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
        Get-FileHash -Algorithm SHA256 .\bin\aria2c.exe |
          Format-List | Out-File "$resultDir/binary-sha256.txt"
        (& .\bin\aria2c.exe --version 2>&1 | Out-String) |
          Out-File "$resultDir/version.txt"
    - name: Verify native PE architecture
      shell: pwsh
      run: scripts/ci/verify-windows-binary.ps1 -Architecture '${{ matrix.asset_arch }}'
    - name: Verify OpenSSL backend and Windows trust store
      shell: pwsh
      run: |
        $expectedOpenSSL = (Select-String -Path scripts/ci/deps.env -Pattern '^OPENSSL_VERSION=').Line.Split('=', 2)[1]
        $versionOutput = (& .\bin\aria2c.exe --version 2>&1 | Out-String)
        if ($LASTEXITCODE -ne 0) { throw "aria2c --version failed: $versionOutput" }
        if ($versionOutput -notmatch [regex]::Escape("OpenSSL/$expectedOpenSSL") -or $versionOutput -match 'WinTLS') {
          throw "Unexpected TLS backend: $versionOutput"
        }
        Remove-Item Env:SSL_CERT_FILE -ErrorAction SilentlyContinue
        Remove-Item Env:SSL_CERT_DIR -ErrorAction SilentlyContinue
        & .\bin\aria2c.exe --no-conf=true --dry-run=true --check-certificate=true --max-tries=2 --connect-timeout=30 --timeout=30 https://www.cloudflare.com/favicon.ico
        if ($LASTEXITCODE -ne 0) { throw 'Windows trust store smoke failed' }
    - name: Verify task cookies and credential redirects
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
      run: node --test test/e2e/task-cookies.e2e.test.mjs
    - name: Verify native HTTP redirect policy
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
      run: node --test test/e2e/http-redirect-policy.e2e.test.mjs
    - name: Verify destinations longer than MAX_PATH
      shell: pwsh
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
        LONG_PATHS_POLICY_OFF: '1'
      run: |
        # Turn the machine policy off so only the \\?\ namespace can make a
        # >260-character destination work (agalwood/Motrix#2183). aria2c reads
        # the policy at process start, and the test spawns it afterwards.
        reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 0 /f
        if ($LASTEXITCODE -ne 0) { throw 'could not turn LongPathsEnabled off' }
        node --test test/e2e/windows-long-path.e2e.test.mjs
        if ($LASTEXITCODE -ne 0) { throw 'long-path download failed' }
    - name: Fetch checksum-pinned schema 3 baseline
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri 'https://github.com/motrixapp/aria2/releases/download/v1.37.0-motrix.16/aria2c-1.37.0-motrix.16-win32-${{ matrix.baseline_arch || matrix.asset_arch }}.zip' -OutFile baseline.zip
        if ((Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ matrix.baseline_sha256 }}') { throw 'Baseline checksum mismatch' }
        Expand-Archive baseline.zip baseline
        "ARIA2_SCHEMA3_BIN=$pwd\baseline\aria2c.exe" >> $env:GITHUB_ENV
    - name: Verify Windows legacy import and crash recovery
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
      shell: pwsh
      run: |
        node --test test/e2e/legacy-checkpoint-import.e2e.test.mjs 2>&1 | Tee-Object -FilePath test-results/ws-contract/legacy-import.txt
        if ($LASTEXITCODE -ne 0) { throw 'Legacy import contract failed' }
    # Collect independent consumer and WebSocket failures even if a legacy
    # fixture fails. The earlier failed step still fails this required job.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ !cancelled() }}
      with:
        repository: agalwood/Motrix
        ref: 122bf3b244bd3298bcd46423d37c7fb72cd7ea80
        path: Motrix
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: ${{ !cancelled() }}
      with:
        version: 12.10.1
        run_install: false
    - name: Install migration consumer dependencies
      if: ${{ !cancelled() }}
      working-directory: Motrix
      env:
        MOTRIX_SKIP_ELECTRON_REBUILD: '1'
        MOTRIX_SKIP_ENGINE_FETCH: '1'
      run: pnpm install --frozen-lockfile
    - name: Verify actual Motrix Windows migration consumer
      if: ${{ !cancelled() }}
      working-directory: Motrix
      env:
        MOTRIX_LEGACY_CHECKPOINT_ENGINE: ${{ github.workspace }}\bin\aria2c.exe
      run: >-
        pnpm exec vitest run
        src/core/engine/aria2/aria2-legacy-path.test.ts
        src/core/engine/aria2/aria2-legacy-checkpoint.integration.test.ts
        src/core/legacy-import/bt-activation-service.test.ts
        src/core/legacy-import/bt-activation.integration.test.ts
        src/core/legacy-import/session-parser.win32.test.ts
        --reporter=verbose --testTimeout=30000
    - name: Verify persistent WebSocket RPC
      if: ${{ !cancelled() }}
      env:
        ARIA2_E2E_BIN: ${{ github.workspace }}\bin\aria2c.exe
        ARIA2_E2E_KEEP_TMP: '1'
        ARIA2_E2E_WORK_DIR: ${{ github.workspace }}\test-results\ws-contract\runs
      run: node --test test/e2e/websocket-rpc-contract.e2e.test.mjs
    - name: Upload Windows binary identity and contract diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ws-contract-${{ matrix.asset_arch }}-${{ matrix.runner }}
        path: test-results/ws-contract
        if-no-files-found: error

  ci-required:
    needs: [build, windows-release-build, windows-ws-contract]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Fail if any required job failed
      run: |
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "matrix result: ${{ needs.build.result }}"
          exit 1
        fi
        if [ "${{ needs.windows-release-build.result }}" != "success" ]; then
          echo "Windows OpenSSL build result: ${{ needs.windows-release-build.result }}"
          exit 1
        fi
        if [ "${{ needs.windows-ws-contract.result }}" != "success" ]; then
          echo "Windows WebSocket contract result: ${{ needs.windows-ws-contract.result }}"
          exit 1
        fi
        echo "all required jobs passed"
