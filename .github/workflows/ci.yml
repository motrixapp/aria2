name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
        compiler: [gcc, clang]
        crypto: [openssl, gnutls]
        bittorrent: [with-bt, without-bt]
        exclude:
        - os: macos-26
          crypto: gnutls
        - crypto: openssl
          bittorrent: without-bt

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Linux setup
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install \
          g++-12 \
          clang-18 \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          libtool \
          pkg-config \
          libssl-dev \
          libgnutls28-dev \
          libc-ares-dev \
          zlib1g-dev \
          libsqlite3-dev \
          libssh2-1-dev \
          libcppunit-dev
    - name: MacOS setup
      if: runner.os == 'macOS'
      run: |
        brew install cppunit gettext openssl libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool
    - name: Setup clang (Linux)
      if: runner.os == 'Linux' && matrix.compiler == 'clang'
      run: |
        echo 'CC=clang-18' >> $GITHUB_ENV
        echo 'CXX=clang++-18' >> $GITHUB_ENV
    - name: Setup clang (MacOS)
      if: runner.os == 'macOS' && matrix.compiler == 'clang'
      run: |
        echo 'CC=clang' >> $GITHUB_ENV
        echo 'CXX=clang++' >> $GITHUB_ENV
    - name: Setup gcc (Linux)
      if: runner.os == 'Linux' && matrix.compiler == 'gcc'
      run: |
        echo 'CC=gcc-12' >> $GITHUB_ENV
        echo 'CXX=g++-12' >> $GITHUB_ENV
    - name: Setup gcc (MacOS)
      if: runner.os == 'macOS' && matrix.compiler == 'gcc'
      run: |
        echo 'CC=gcc' >> $GITHUB_ENV
        echo 'CXX=g++' >> $GITHUB_ENV
    - name: Libtool
      run: |
        autoreconf -i
    - name: Setup compiler flags
      run: |
        asanflags="-fsanitize=address,undefined -fno-sanitize-recover=undefined"

        CPPFLAGS="$asanflags -g3"
        LDFLAGS="$asanflags"

        echo 'CPPFLAGS='"$CPPFLAGS" >> $GITHUB_ENV
        echo 'LDFLAGS='"$LDFLAGS" >> $GITHUB_ENV
    - name: Disable BitTorrent
      if: matrix.bittorrent == 'without-bt'
      run: |
        FEATURE_FLAGS="$FEATURE_FLAGS --disable-bittorrent"

        echo 'FEATURE_FLAGS='"$FEATURE_FLAGS" >> $GITHUB_ENV
    - name: Configure autotools (Linux, gnutls)
      if: runner.os == 'Linux' && matrix.crypto == 'gnutls'
      run: |
        ./configure --with-gnutls --without-openssl $FEATURE_FLAGS
    - name: Configure autotools (Linux, openssl)
      if: runner.os == 'Linux' && matrix.crypto == 'openssl'
      run: |
        ./configure --without-gnutls --with-openssl $FEATURE_FLAGS
    - name: Configure autotools (macOS)
      if: runner.os == 'macOS'
      run: |
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --disable-nls
    - name: Build aria2
      run: |
        make -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)" check
    - name: Show test-suite.log on failure
      if: failure()
      run: |
        echo "===== test/test-suite.log ====="
        cat test/test-suite.log || echo "(no test/test-suite.log produced)"
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.crypto }}-${{ matrix.bittorrent }}
        path: |
          test/test-suite.log
          test/*.log
        if-no-files-found: ignore

  wintls-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build WinTLS compatibility binary
      run: |
        docker build \
          -f Dockerfile.mingw \
          --build-arg HOST=x86_64-w64-mingw32 \
          --build-arg TLS_BACKEND=wintls \
          -t aria2-mingw-wintls-ci .
        id=$(docker create aria2-mingw-wintls-ci)
        docker cp "$id:/aria2/src/aria2c.exe" ./aria2c.exe
        docker rm "$id"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wintls-win32-x64
        path: aria2c.exe

  wintls-smoke:
    needs: wintls-build
    runs-on: windows-2025
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: wintls-win32-x64
        path: dist
    - name: Verify TLS 1.3 post-handshake handling
      shell: pwsh
      run: |
        $versionOutput = (& .\dist\aria2c.exe --version 2>&1 | Out-String)
        if ($LASTEXITCODE -ne 0) { throw "aria2c --version failed: $versionOutput" }
        if ($versionOutput -notmatch 'WinTLS') {
          throw "Expected WinTLS compatibility backend: $versionOutput"
        }
        if ($versionOutput -match 'OpenSSL/') {
          throw "WinTLS compatibility build must not select the OpenSSL backend: $versionOutput"
        }

        $downloadDir = Join-Path $env:RUNNER_TEMP 'aria2-wintls-smoke'
        New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
        $targets = @(
          @{ Url = 'https://www.cloudflare.com/cdn-cgi/trace'; Out = 'cloudflare-trace.txt' }
        )
        $allLogs = ''
        foreach ($target in $targets) {
          $logPath = Join-Path $downloadDir "$($target.Out).log"
          $ariaArgs = @(
            '--no-conf=true',
            '-x1',
            '-s1',
            '--check-certificate=true',
            '--max-tries=1',
            '--connect-timeout=30',
            '--timeout=30',
            '--file-allocation=none',
            '--allow-overwrite=true',
            '--auto-file-renaming=false',
            "--dir=$downloadDir",
            "--out=$($target.Out)",
            "--log=$logPath",
            '--log-level=debug',
            '--console-log-level=notice'
          )
          & .\dist\aria2c.exe @ariaArgs $target.Url
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue
            throw "WinTLS HTTPS smoke failed for $($target.Url) (exit $LASTEXITCODE)"
          }
          $outputPath = Join-Path $downloadDir $target.Out
          if (-not (Test-Path -LiteralPath $outputPath) -or
              (Get-Item -LiteralPath $outputPath).Length -eq 0) {
            throw "WinTLS HTTPS smoke produced no data for $($target.Url)"
          }
          $allLogs += Get-Content -LiteralPath $logPath -Raw
        }

        if ($allLogs -notmatch 'Securely connected.*TLSv1\.3') {
          throw 'WinTLS smoke did not negotiate TLS 1.3'
        }
        if ($allLogs -notmatch
            'WinTLS: Processing renegotiation or post-handshake message') {
          throw 'WinTLS smoke did not exercise the TLS post-handshake path'
        }
        if ($allLogs -match '80090326') {
          throw 'WinTLS smoke encountered SEC_E_ILLEGAL_MESSAGE (0x80090326)'
        }

  ci-required:
    needs: [build, wintls-smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Fail if any required job failed
      run: |
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "matrix result: ${{ needs.build.result }}"
          exit 1
        fi
        if [ "${{ needs.wintls-smoke.result }}" != "success" ]; then
          echo "WinTLS smoke result: ${{ needs.wintls-smoke.result }}"
          exit 1
        fi
        echo "all required jobs passed"
