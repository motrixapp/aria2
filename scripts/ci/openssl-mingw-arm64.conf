# OpenSSL 3.5 supports Windows ARM64 assembly but does not ship a MinGW
# target for it. Use the upstream reproducer's target with LLVM-MinGW:
# https://github.com/openssl/openssl/issues/26415
my %targets = (
    "mingw-arm64" => {
        inherit_from   => [ "mingw-common" ],
        bn_ops         => add("SIXTY_FOUR_BIT"),
        asm_arch       => "aarch64",
        perlasm_scheme => "win64",
    },
);
